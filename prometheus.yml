global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "meridian-processor"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "meridian-fraud"
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: "meridian-settlement"
    static_configs:
      - targets: ["host.docker.internal:9102"]

  - job_name: "meridian-dispute"
    static_configs:
      - targets: ["host.docker.internal:9103"]

  - job_name: "meridian-api"
    static_configs:
      - targets: ["host.docker.internal:8000"]
